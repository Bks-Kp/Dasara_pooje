<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mysuru Dasara Festival Canvas</title>
    <!-- Tailwind CSS for utility styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts for Kannada and English Festive Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800;900&family=Noto+Serif+Kannada:wght@700;800;900&family=Tiro+Kannada:ital@0;1&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #02020a;
            cursor: none; /* Ideal for continuous 24/7 billboard and kiosk display */
        }

        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body class="w-full h-full bg-[#02020a] overflow-hidden">
    <canvas id="stageCanvas"></canvas>

    <script>
        const canvas = document.getElementById('stageCanvas');
        const ctx = canvas.getContext('2d');

        const DURATION = 20.0; // 20-second loop duration
        let width = 0;
        let height = 0;
        let dpr = 1;
        let topFlightHeight = 0; // Strictly top 1/9th boundary
        let corridorCenterY = 0;

        // Background Starfield
        const STARS = [];
        const STAR_COUNT = 150;

        // Ambient Festive Fireworks
        const FIREWORKS = [];
        const MAX_FIREWORKS = 100;

        // Neon trail history buffers for left & right elephants
        const leftContrailHistory = [];
        const rightContrailHistory = [];

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            dpr = Math.min(window.devicePixelRatio || 1, 2);

            canvas.width = Math.floor(width * dpr);
            canvas.height = Math.floor(height * dpr);
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

            // Strictly 1/9th of the screen height
            topFlightHeight = height / 9;
            corridorCenterY = topFlightHeight * 0.52;
        }

        window.addEventListener('resize', resize);

        function initStars() {
            STARS.length = 0;
            for (let i = 0; i < STAR_COUNT; i++) {
                STARS.push({
                    x: Math.random(),
                    y: Math.random() * 0.85,
                    r: Math.random() * 1.3 + 0.4,
                    alpha: Math.random() * 0.75 + 0.25,
                    twinkleSpeed: Math.random() * 2.5 + 1.0
                });
            }
        }
        initStars();

        function triggerFirework(x, y, color) {
            const count = 24;
            for (let i = 0; i < count; i++) {
                const angle = (Math.PI * 2 * i) / count;
                const speed = Math.random() * 2.6 + 0.8;
                FIREWORKS.push({
                    x: x,
                    y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    alpha: 1,
                    decay: Math.random() * 0.018 + 0.012,
                    color: color,
                    size: Math.random() * 2.0 + 1.0
                });
            }
            if (FIREWORKS.length > MAX_FIREWORKS) {
                FIREWORKS.splice(0, FIREWORKS.length - MAX_FIREWORKS);
            }
        }

        function drawMysorePalaceSkyline(time) {
            // Majestic Deep Royal Night Gradient
            const skyGrad = ctx.createLinearGradient(0, 0, 0, height);
            skyGrad.addColorStop(0, '#02010b');
            skyGrad.addColorStop(0.2, '#08061f');
            skyGrad.addColorStop(0.55, '#130a2f');
            skyGrad.addColorStop(0.85, '#260c33');
            skyGrad.addColorStop(1, '#13041c');
            ctx.fillStyle = skyGrad;
            ctx.fillRect(0, 0, width, height);

            // Twinkling Royal Constellations
            for (let i = 0; i < STARS.length; i++) {
                const st = STARS[i];
                const twinkle = Math.sin(time * st.twinkleSpeed + i) * 0.4 + 0.6;
                ctx.fillStyle = `rgba(255, 245, 215, ${st.alpha * twinkle})`;
                ctx.beginPath();
                ctx.arc(st.x * width, st.y * height, st.r, 0, Math.PI * 2);
                ctx.fill();
            }

            // Mysore Chamundi Hill Silhouette
            ctx.fillStyle = '#080417';
            ctx.beginPath();
            ctx.moveTo(0, height);
            ctx.lineTo(0, height * 0.84);
            ctx.quadraticCurveTo(width * 0.3, height * 0.77, width * 0.55, height * 0.82);
            ctx.quadraticCurveTo(width * 0.82, height * 0.87, width, height * 0.82);
            ctx.lineTo(width, height);
            ctx.closePath();
            ctx.fill();

            // Mysore Palace Majestic Illumination (Bottom Section)
            const palaceY = height * 0.86;
            const palaceH = height * 0.14;
            const pPulse = 0.88 + Math.sin(time * 2.8) * 0.12;

            // Warm golden ambient illumination spread
            const glowGrad = ctx.createRadialGradient(width / 2, height * 0.94, 20, width / 2, height * 0.94, width * 0.55);
            glowGrad.addColorStop(0, `rgba(255, 175, 0, ${0.28 * pPulse})`);
            glowGrad.addColorStop(0.55, `rgba(255, 80, 0, ${0.1 * pPulse})`);
            glowGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = glowGrad;
            ctx.fillRect(0, height * 0.7, width, height * 0.3);

            // Palace Architectural Silhouette
            ctx.save();
            ctx.strokeStyle = `rgba(255, 215, 0, ${0.45 * pPulse})`;
            ctx.lineWidth = 1.2;
            ctx.fillStyle = '#05020f';

            const cx = width / 2;
            const pw = Math.min(width * 0.9, 1100);
            const startX = cx - pw / 2;
            const endX = cx + pw / 2;

            ctx.beginPath();
            ctx.moveTo(0, height);
            ctx.lineTo(0, palaceY + 24);
            ctx.lineTo(startX, palaceY + 24);

            const segments = 12;
            const segW = pw / segments;

            for (let i = 0; i <= segments; i++) {
                const sx = startX + i * segW;
                if (i === 6) {
                    // Central Durbar Gilded Dome
                    ctx.lineTo(sx - segW * 0.42, palaceY + 8);
                    ctx.quadraticCurveTo(sx, palaceY - palaceH * 0.85, sx + segW * 0.42, palaceY + 8);
                } else if (i === 3 || i === 9) {
                    // Secondary Symmetrical Domes
                    ctx.lineTo(sx - segW * 0.3, palaceY + 14);
                    ctx.quadraticCurveTo(sx, palaceY - palaceH * 0.52, sx + segW * 0.3, palaceY + 14);
                } else {
                    // Chhatris & Ornate Pillars
                    ctx.lineTo(sx - 8, palaceY + 20);
                    ctx.lineTo(sx, palaceY + 4);
                    ctx.lineTo(sx + 8, palaceY + 20);
                }
            }

            ctx.lineTo(endX, palaceY + 24);
            ctx.lineTo(width, palaceY + 24);
            ctx.lineTo(width, height);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            // Festive Fairy Bulbs along Palace Lines
            const bulbCount = 44;
            for (let b = 0; b <= bulbCount; b++) {
                const bx = startX + (pw / bulbCount) * b;
                const by = palaceY + 20 + Math.sin(b * 0.85) * 3;
                ctx.fillStyle = (b % 2 === 0) ? `rgba(255, 238, 140, ${pPulse})` : `rgba(255, 150, 40, ${pPulse})`;
                ctx.beginPath();
                ctx.arc(bx, by, 1.4, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.restore();

            // Festive Fireworks Display during hold phase (0:09.5s – 0:20s)
            if (time > 8.0 && Math.random() < 0.05) {
                const fxX = width * (0.12 + Math.random() * 0.76);
                const fxY = height * (0.26 + Math.random() * 0.35);
                const colors = ['#ffd700', '#ff9100', '#00e5ff', '#ff007f', '#4eecb0'];
                triggerFirework(fxX, fxY, colors[Math.floor(Math.random() * colors.length)]);
            }

            // Update & Render Fireworks
            for (let f = FIREWORKS.length - 1; f >= 0; f--) {
                const p = FIREWORKS[f];
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.025; // subtle gravity
                p.alpha -= p.decay;

                if (p.alpha <= 0) {
                    FIREWORKS.splice(f, 1);
                } else {
                    ctx.fillStyle = p.color;
                    ctx.globalAlpha = p.alpha;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.globalAlpha = 1;
                }
            }
        }

        function drawRoyalElephant(ctx, x, y, facingRight, bankAngle, scale = 1.0) {
            ctx.save();
            ctx.translate(x, y);

            // Smooth upward cruising bank angle
            const angle = facingRight ? -bankAngle : bankAngle;
            ctx.rotate(angle);
            if (!facingRight) {
                ctx.scale(-1, 1);
            }
            ctx.scale(scale, scale);

            // Radiant Divine Aura around the Ambari Elephant
            const aura = ctx.createRadialGradient(0, -6, 8, 0, -6, 68);
            aura.addColorStop(0, 'rgba(255, 215, 0, 0.42)');
            aura.addColorStop(0.5, 'rgba(255, 120, 0, 0.16)');
            aura.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = aura;
            ctx.beginPath();
            ctx.arc(0, -6, 68, 0, Math.PI * 2);
            ctx.fill();

            // 1. Elephant Body & Limbs in majestic cruising stride
            ctx.fillStyle = '#21222b';
            ctx.strokeStyle = '#e6b800';
            ctx.lineWidth = 1.4;

            ctx.beginPath();
            // Tail
            ctx.moveTo(-42, -4);
            ctx.quadraticCurveTo(-54, 8, -48, 18);
            // Hind Legs
            ctx.lineTo(-36, 36);
            ctx.lineTo(-27, 36);
            ctx.lineTo(-23, 10);
            ctx.lineTo(-10, 39);
            ctx.lineTo(-2, 39);
            ctx.lineTo(2, 9);
            // Belly
            ctx.quadraticCurveTo(12, 14, 21, 10);
            // Front Legs
            ctx.lineTo(31, 38);
            ctx.lineTo(40, 36);
            ctx.lineTo(35, 5);
            ctx.lineTo(44, 32);
            ctx.lineTo(53, 30);
            // Chest & Neck
            ctx.lineTo(49, -10);
            // Curled Trunk in Royal Salutation
            ctx.quadraticCurveTo(62, -4, 70, 10);
            ctx.quadraticCurveTo(77, 20, 78, 12);
            ctx.quadraticCurveTo(73, -12, 63, -26);
            // Forehead & Cranial Dome
            ctx.quadraticCurveTo(50, -40, 34, -36);
            // Back
            ctx.quadraticCurveTo(0, -39, -42, -4);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            // 2. Mysore Tusks (Golden Cap Ivory)
            ctx.fillStyle = '#fffff2';
            ctx.shadowColor = '#ffd700';
            ctx.shadowBlur = 6;
            ctx.beginPath();
            ctx.moveTo(55, -8);
            ctx.quadraticCurveTo(70, -5, 75, -21);
            ctx.quadraticCurveTo(68, -10, 53, -2);
            ctx.closePath();
            ctx.fill();
            ctx.shadowBlur = 0;

            // 3. Decorated Royal Blanket (Jhul / Jhool)
            const jhulGrad = ctx.createLinearGradient(-28, -20, 20, 12);
            jhulGrad.addColorStop(0, '#c70039');
            jhulGrad.addColorStop(0.5, '#900c3f');
            jhulGrad.addColorStop(1, '#ff5733');
            ctx.fillStyle = jhulGrad;
            ctx.strokeStyle = '#ffd700';
            ctx.lineWidth = 1.8;

            ctx.beginPath();
            ctx.moveTo(-28, -23);
            ctx.quadraticCurveTo(0, -26, 28, -21);
            ctx.lineTo(24, 6);
            ctx.quadraticCurveTo(0, 13, -24, 6);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            // Gilded fringe beads
            ctx.fillStyle = '#ffd700';
            for (let t = -19; t <= 19; t += 6.5) {
                ctx.beginPath();
                ctx.arc(t, 7 + Math.sin(t * 0.35) * 1.5, 1.6, 0, Math.PI * 2);
                ctx.fill();
            }

            // 4. Nettipattam (Golden Forehead Armor)
            ctx.fillStyle = '#ffd700';
            ctx.beginPath();
            ctx.moveTo(45, -34);
            ctx.lineTo(55, -20);
            ctx.lineTo(47, -10);
            ctx.lineTo(37, -21);
            ctx.closePath();
            ctx.fill();
            ctx.strokeStyle = '#fff8b3';
            ctx.lineWidth = 0.8;
            ctx.stroke();

            // 5. Mysuru Golden Ambari / Howdah
            const howdahGrad = ctx.createLinearGradient(-12, -48, 12, -24);
            howdahGrad.addColorStop(0, '#fff099');
            howdahGrad.addColorStop(0.5, '#ffb703');
            howdahGrad.addColorStop(1, '#fb8500');
            ctx.fillStyle = howdahGrad;
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 1.0;

            ctx.beginPath();
            ctx.moveTo(-15, -26);
            ctx.lineTo(-18, -44);
            ctx.lineTo(0, -54); // Kalasha peak
            ctx.lineTo(18, -44);
            ctx.lineTo(15, -26);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            // Howdah Kalasha Finial Dome
            ctx.beginPath();
            ctx.arc(0, -55.5, 2.8, 0, Math.PI * 2);
            ctx.fillStyle = '#ffffff';
            ctx.fill();

            ctx.restore();
        }

        function getElephantState(time) {
            // Strictly locked to the top 1/9th corridor
            // Banked upward cruising angle (~5.7 degrees)
            const bankAngle = 0.098;
            const startY = topFlightHeight * 0.65;
            const cruisingY = corridorCenterY;

            let leftX, rightX, leftY, rightY, leftVisible, rightVisible;

            if (time <= 2.0) {
                // Phase 1: 0:00 – 0:02s (Rapid Entry)
                // Fast acceleration from opposite screen edges into framing coordinates
                const prog = Math.min(time / 2.0, 1.0);
                // Power ease-out for fast dynamic entry sweep
                const ease = 1 - Math.pow(1 - prog, 2.5);

                const targetLeftX = width * 0.22;
                const targetRightX = width * 0.78;

                leftX = -150 + (targetLeftX + 150) * ease;
                rightX = (width + 150) - (width + 150 - targetRightX) * ease;

                leftY = startY - (startY - cruisingY) * ease;
                rightY = startY - (startY - cruisingY) * ease;
                leftVisible = true;
                rightVisible = true;
            } else if (time <= 5.5) {
                // Phase 2: 0:02 – 0:05.5s (The Trail)
                // Swift cruising while leaving brilliant neon contrails across the sky
                const prog = (time - 2.0) / 3.5;
                leftX = width * 0.22 + (width * 0.09) * prog;
                rightX = width * 0.78 - (width * 0.09) * prog;

                leftY = cruisingY + Math.sin(time * 3.2) * 3.2;
                rightY = cruisingY + Math.cos(time * 3.2) * 3.2;
                leftVisible = true;
                rightVisible = true;
            } else if (time <= 9.5) {
                // Phase 3: 0:05.5 – 0:09.5s (Typography Reveal)
                // Elephants frame the typography positioned cleanly between them
                const prog = (time - 5.5) / 4.0;
                leftX = width * 0.31 + (width * 0.05) * prog;
                rightX = width * 0.69 - (width * 0.05) * prog;

                leftY = cruisingY + Math.sin(time * 2.5) * 2.8;
                rightY = cruisingY + Math.cos(time * 2.5) * 2.8;
                leftVisible = true;
                rightVisible = true;
            } else if (time <= 11.5) {
                // Phase 4: 0:09.5 – 0:11.5s (High-Speed Exit)
                // Fast exit to opposite edges within the initial 2.0s of Phase 4
                const exitProg = (time - 9.5) / 2.0;
                // Cubic ease-in for rapid departure
                const exitEase = Math.pow(exitProg, 2.8);

                const originLeftX = width * 0.36;
                const originRightX = width * 0.64;

                leftX = originLeftX + (width + 250 - originLeftX) * exitEase;
                rightX = originRightX - (originRightX + 250) * exitEase;

                leftY = cruisingY - 10 * exitProg;
                rightY = cruisingY - 10 * exitProg;

                leftVisible = leftX < width + 180;
                rightVisible = rightX > -180;
            } else {
                // 11.5s - 20s (Hold phase): Elephants exited off-screen; typography locks & pulses
                leftVisible = false;
                rightVisible = false;
                leftX = width + 600;
                rightX = -600;
                leftY = cruisingY;
                rightY = cruisingY;
            }

            return {
                leftX, leftY, leftVisible,
                rightX, rightY, rightVisible,
                bankAngle
            };
        }

        function drawNeonContrail(history, primaryColor, secondaryColor) {
            if (history.length < 2) return;

            ctx.save();
            ctx.shadowColor = primaryColor;
            ctx.shadowBlur = 16;

            // Outer vibrant glowing streak
            for (let i = 1; i < history.length; i++) {
                const p0 = history[i - 1];
                const p1 = history[i];
                const progress = i / history.length;

                ctx.beginPath();
                ctx.moveTo(p0.x, p0.y);
                ctx.lineTo(p1.x, p1.y);
                ctx.strokeStyle = progress > 0.5 ? primaryColor : secondaryColor;
                ctx.globalAlpha = Math.min(progress * 1.25, 0.9);
                ctx.lineWidth = progress * 6.0 + 1.2;
                ctx.lineCap = 'round';
                ctx.stroke();
            }

            // High-intensity white inner core
            ctx.beginPath();
            for (let i = 0; i < history.length; i++) {
                const pt = history[i];
                if (i === 0) ctx.moveTo(pt.x, pt.y);
                else ctx.lineTo(pt.x, pt.y);
            }
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 1.8;
            ctx.globalAlpha = 0.85;
            ctx.stroke();

            ctx.restore();
        }

        function renderCrispTypography(time) {
            // Typography begins revealing at 0:05.5s, sharpens through 0:09.5s, holds and pulses through 0:20s
            if (time < 7.0) return;

            // Smooth reveal opacity calculation without any scattered particle dots
            let textAlpha = 0;
            let scaleProg = 1;

            if (time >= 77.0 && time < 9.5) {
                const prog = (time - 5.0) / 4.5;
                textAlpha = Math.min(Math.pow(prog, 1.4), 1.0);
                scaleProg = 0.94 + 0.06 * prog;
            } else {
                // 9.5s - 20s: Locked into place with subtle ambient pulse
                textAlpha = 1.0;
                scaleProg = 1.0 + Math.sin(time * 2.4) * 0.015;
            }

            const pulseGlow = (time >= 9.5) ? (16 + Math.sin(time * 3.0) * 6) : 12;

            ctx.save();
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            // Scale centered at corridor midpoint
            ctx.translate(width / 2, corridorCenterY);
            ctx.scale(scaleProg, scaleProg);
            ctx.translate(-width / 2, -corridorCenterY);

            const isNarrow = width < 768;
            // Proportional font sizes strictly scaled to fit top 1/9th zone
            const kannadaFontSize = Math.min(Math.max(topFlightHeight * (isNarrow ? 0.32 : 0.36), 14), 28);
            const engFontSize = Math.min(Math.max(topFlightHeight * (isNarrow ? 0.24 : 0.26), 11), 20);

            // Radiant Golden Background Aura
            ctx.shadowColor = '#ffb700';
            ctx.shadowBlur = pulseGlow;

            // Royal Gold Gradient for Kannada Typography
            const goldGrad = ctx.createLinearGradient(width * 0.3, corridorCenterY - 18, width * 0.7, corridorCenterY + 18);
            goldGrad.addColorStop(0, '#ffffff');
            goldGrad.addColorStop(0.2, '#fff1a8');
            goldGrad.addColorStop(0.6, '#ffd700');
            goldGrad.addColorStop(1, '#ff9e00');

            ctx.fillStyle = goldGrad;
            ctx.globalAlpha = textAlpha;

            if (isNarrow) {
                // Line 1: Kannada "ನಮ್ಮ ಹೆಮ್ಮೆ, ನಮ್ಮ ನಾಡಹಬ್ಬ ದಸರಾ ಹಬ್ಬದ ಹಾರ್ದಿಕ ಶುಭಾಶಯಗಳು!"
                ctx.font = `800 ${kannadaFontSize}px 'Noto Serif Kannada', 'Tiro Kannada', serif`;
                ctx.fillText('ನಮ್ಮ ಹೆಮ್ಮೆ, ನಮ್ಮ ನಾಡಹಬ್ಬ!! ದಸರಾ ಹಬ್ಬದ ಹಾರ್ದಿಕ ಶುಭಾಶಯಗಳು!', width / 2, corridorCenterY - kannadaFontSize * 0.55);

                // Line 2: English "Wishing you a spectacular Dasara! May the divine blessings of Goddess Chamundeshwari bring victory, endless joy, and prosperity to your home. "
                const cyanGrad = ctx.createLinearGradient(width * 0.3, corridorCenterY + 5, width * 0.7, corridorCenterY + 25);
                cyanGrad.addColorStop(0, '#e0f7fa');
                cyanGrad.addColorStop(0.5, '#00e5ff');
                cyanGrad.addColorStop(1, '#ffd700');

                ctx.shadowColor = '#00e5ff';
                ctx.shadowBlur = pulseGlow * 0.7;
                ctx.fillStyle = cyanGrad;
                ctx.font = `900 ${engFontSize}px 'Cinzel', serif`;
                ctx.fillText('Wishing you a spectacular Dasara! May the divine blessings of Goddess Chamundeshwari bring victory, endless joy, and prosperity to your home. ', width / 2, corridorCenterY + engFontSize * 0.75);
            } else {
                // Line 1: Kannada "ನಮ್ಮ ಹೆಮ್ಮೆ, ನಮ್ಮ ನಾಡಹಬ್ಬ ದಸರಾ ಹಬ್ಬದ ಹಾರ್ದಿಕ ಶುಭಾಶಯಗಳು!"
                ctx.font = `800 ${kannadaFontSize}px 'Noto Serif Kannada', 'Tiro Kannada', serif`;
                ctx.fillText('ನಮ್ಮ ಹೆಮ್ಮೆ, ನಮ್ಮ ನಾಡಹಬ್ಬ ದಸರಾ ಹಬ್ಬದ ಹಾರ್ದಿಕ ಶುಭಾಶಯಗಳು!', width / 2, corridorCenterY - kannadaFontSize * 0.48);

                // Line 2: English "• Wishing you a spectacular Dasara! May the divine blessings of Goddess Chamundeshwari bring victory, endless joy, and prosperity to your home.  •"
                const cyanGrad = ctx.createLinearGradient(width * 0.3, corridorCenterY + 2, width * 0.7, corridorCenterY + 22);
                cyanGrad.addColorStop(0, '#e0f7fa');
                cyanGrad.addColorStop(0.5, '#00e5ff');
                cyanGrad.addColorStop(1, '#ffd700');

                ctx.shadowColor = '#00e5ff';
                ctx.shadowBlur = pulseGlow * 0.7;
                ctx.fillStyle = cyanGrad;
                ctx.font = `900 ${engFontSize}px 'Cinzel', serif`;
                ctx.fillText('• Wishing you a spectacular Dasara! May the divine blessings of Goddess Chamundeshwari bring victory, endless joy, and prosperity to your home.  •', width / 2, corridorCenterY + engFontSize * 0.72);
            }

            // Crisp decorative royal divider flourish
            const lineW = Math.min(width * 0.36, 360);
            const lineY = isNarrow ? corridorCenterY + engFontSize * 1.5 : corridorCenterY + engFontSize * 1.35;
            ctx.strokeStyle = `rgba(255, 215, 0, ${0.6 * textAlpha})`;
            ctx.lineWidth = 1.2;
            ctx.beginPath();
            ctx.moveTo(width / 2 - lineW / 2, lineY);
            ctx.lineTo(width / 2 - 14, lineY);
            ctx.arc(width / 2, lineY, 2.2, 0, Math.PI * 2);
            ctx.moveTo(width / 2 + 14, lineY);
            ctx.lineTo(width / 2 + lineW / 2, lineY);
            ctx.stroke();

            ctx.restore();
        }

        let lastTimestamp = null;
        let elapsedLoopTime = 0; // Ranges continuously from 0.0 to 20.0 seconds

        function animationLoop(timestamp) {
            if (!lastTimestamp) lastTimestamp = timestamp;
            const delta = (timestamp - lastTimestamp) / 1000;
            lastTimestamp = timestamp;

            // Advance time and cleanly wrap at 20.0s for whole-day 24/7 continuous playback
            const prevTime = elapsedLoopTime;
            elapsedLoopTime = (elapsedLoopTime + delta) % DURATION;

            // Handle loop reset
            if (elapsedLoopTime < prevTime) {
                leftContrailHistory.length = 0;
                rightContrailHistory.length = 0;
            }

            const currentTime = elapsedLoopTime;

            // 1. Clear Frame
            ctx.clearRect(0, 0, width, height);

            // 2. Render Mysore Palace Horizon, Sky & Celebratory Lights
            drawMysorePalaceSkyline(currentTime);

            // 3. Compute High-Speed Elephant Coordinates strictly in top 1/9th band
            const state = getElephantState(currentTime);

            // 4. Update Neon Contrail buffer from Elephant Tail Emitters
            if (currentTime >= 0.1 && currentTime <= 11.5) {
                if (state.leftVisible) {
                    leftContrailHistory.push({
                        x: state.leftX - 35,
                        y: state.leftY - 3
                    });
                }
                if (state.rightVisible) {
                    rightContrailHistory.push({
                        x: state.rightX + 35,
                        y: state.rightY - 3
                    });
                }

                const maxHistory = (currentTime < 5.5) ? 60 : 40;
                if (leftContrailHistory.length > maxHistory) leftContrailHistory.shift();
                if (rightContrailHistory.length > maxHistory) rightContrailHistory.shift();
            } else {
                if (leftContrailHistory.length > 0) leftContrailHistory.shift();
                if (rightContrailHistory.length > 0) rightContrailHistory.shift();
            }

            // 5. Draw Glowing Neon Light Streaks
            if (currentTime >= 0.3) {
                drawNeonContrail(leftContrailHistory, '#ffd700', '#ff8500'); // Radiant Golden Streak
                drawNeonContrail(rightContrailHistory, '#00e5ff', '#3a7bd5'); // Electric Cyan Streak
            }

            // 6. Draw Crisp Vector Typography cleanly between elephants (No scattered dots)
            renderCrispTypography(currentTime);

            // 7. Render Royal Ambari Elephants (scaled precisely to fit top 1/9th corridor)
            const elephantScale = Math.min(Math.max((topFlightHeight / 115), 0.48), 0.88);

            // Left Elephant cruising rightward
            if (state.leftVisible) {
                drawRoyalElephant(ctx, state.leftX, state.leftY, true, state.bankAngle, elephantScale);
            }

            // Right Elephant cruising leftward
            if (state.rightVisible) {
                drawRoyalElephant(ctx, state.rightX, state.rightY, false, state.bankAngle, elephantScale);
            }

            requestAnimationFrame(animationLoop);
        }

        window.onload = function() {
            resize();
            requestAnimationFrame(animationLoop);
        };
    </script>
</body>
</html>
