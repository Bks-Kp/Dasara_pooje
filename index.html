
<!DOCTYPE html>
<html lang="kn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ದಸರಾ ಹಬ್ಬದ ಶುಭಾಶಯಗಳು</title>

  <!-- Kannada font -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Kannada:wght@400;600;700&display=swap"
        rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      overflow: hidden;
      font-family: 'Noto Sans Kannada', sans-serif;
      background:
        radial-gradient(
          ellipse at center,
          #8f160b 0%,
          #430608 55%,
          #170308 100%
        );
      color: #fff3bd;
    }

    /* Main festival background */
    .festival {
      position: relative;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      isolation: isolate;
    }

    /* Golden decorative border */
    .festival::before {
      content: "";
      position: absolute;
      inset: 18px;
      border: 3px double #f8c95b;
      border-radius: 16px;
      box-shadow:
        0 0 30px #ffb52b55,
        inset 0 0 35px #ffbf4422;
      pointer-events: none;
      z-index: 4;
    }

    /* Glowing lights at the top */
    .lights {
      position: absolute;
      top: 35px;
      width: 90%;
      display: flex;
      justify-content: space-around;
      z-index: 2;
    }

    .lights span {
      width: 10px;
      height: 14px;
      border-radius: 50%;
      background: #ffe69b;
      box-shadow: 0 0 12px 5px #ffb52b;
      animation: twinkle 1.5s infinite alternate;
    }

    .lights span:nth-child(even) {
      animation-delay: 0.7s;
    }

    @keyframes twinkle {
      from {
        opacity: 0.45;
      }

      to {
        opacity: 1;
        box-shadow: 0 0 22px 8px #ffad23;
      }
    }

    /* Kannada greeting at the top */
    .top-greeting {
      position: absolute;
      top: 75px;
      left: 0;
      width: 100%;
      overflow: hidden;
      padding: 20px 0;
      z-index: 3;
    }

    /* Moving greeting */
    .greeting {
      width: max-content;
      white-space: nowrap;
      font-size: clamp(1.5rem, 5vw, 3.5rem);
      font-weight: 700;
      color: #ffdf70;
      text-shadow:
        0 0 8px #ffae00,
        0 0 22px #ff6a00,
        3px 4px 2px #450000;
      animation: moveRight 12s linear infinite;
    }

    @keyframes moveRight {
      from {
        transform: translateX(-100%);
      }

      to {
        transform: translateX(100vw);
      }
    }

    /* Festive lamps and flowers */
    .lamps {
      position: absolute;
      bottom: 13%;
      width: 100%;
      display: flex;
      justify-content: space-evenly;
      align-items: center;
      font-size: clamp(2rem, 5vw, 4rem);
      z-index: 1;
    }

    .lamp {
      animation: glow 2s ease-in-out infinite alternate;
      filter: drop-shadow(0 0 12px #ff9d00);
    }

    @keyframes glow {
      from {
        transform: translateY(0);
      }

      to {
        transform: translateY(-8px);
      }
    }

    /* Bottom greeting */
    .bottom-message {
      position: absolute;
      bottom: 6%;
      text-align: center;
      color: #ffe8a5;
      font-size: clamp(0.8rem, 2vw, 1.2rem);
      letter-spacing: 2px;
      padding: 0 30px;
      z-index: 2;
    }

    /* Falling flower petals */
    .petal {
      position: absolute;
      top: -40px;
      z-index: 1;
      animation: fall linear infinite;
      pointer-events: none;
    }

    @keyframes fall {
      to {
        transform: translateY(110vh) rotate(540deg);
      }
    }

    /* Mobile responsive design */
    @media (max-width: 600px) {
      .top-greeting {
        top: 65px;
      }

      .greeting {
        animation-duration: 10s;
      }

      .lamps {
        bottom: 17%;
      }

      .bottom-message {
        bottom: 8%;
        letter-spacing: 1px;
      }
    }

    /* Accessibility: respect reduced motion */
    @media (prefers-reduced-motion: reduce) {
      .greeting,
      .lamp,
      .lights span,
      .petal {
        animation-play-state: paused;
      }
    }
  </style>
</head>

<body>

  <main class="festival">

    <!-- Festive glowing lights -->
    <div class="lights" aria-hidden="true">
      <span></span>
      <span></span>
      <span></span>
      <span></span>
      <span></span>
      <span></span>
      <span></span>
      <span></span>
      <span></span>
      <span></span>
      <span></span>
      <span></span>
    </div>

    <!-- Kannada greeting moving at the top -->
    <div class="top-greeting">
      <div class="greeting">
        🌺 ದಸರಾ ಹಬ್ಬದ ಶುಭಾಶಯಗಳು 🌺
      </div>
    </div>

    <!-- Festive diyas and flowers -->
    <div class="lamps" aria-hidden="true">
      <span class="lamp">🪔</span>
      <span class="lamp">🌸</span>
      <span class="lamp">🪔</span>
      <span class="lamp">🌼</span>
      <span class="lamp">🪔</span>
    </div>

    <!-- Bottom message -->
    <div class="bottom-message">
      May this Dasara bring joy, success &amp; prosperity 🙏
    </div>

  </main>

  <script>
    // Create falling festive petals
    const flowers = ["🌼", "🌸", "🌺", "✨"];
    const festival = document.querySelector(".festival");

    for (let i = 0; i < 24; i++) {
      const petal = document.createElement("span");

      petal.className = "petal";
      petal.textContent =
        flowers[Math.floor(Math.random() * flowers.length)];

      petal.style.left = Math.random() * 100 + "vw";

      petal.style.animationDuration =
        (7 + Math.random() * 10) + "s";

      petal.style.animationDelay =
        (-Math.random() * 15) + "s";

      petal.style.fontSize =
        (14 + Math.random() * 18) + "px";

      festival.appendChild(petal);
    }
  </script>

</body>
</html>
